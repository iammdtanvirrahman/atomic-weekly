<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>Atomic Magazine · PDF</title>
<link rel="icon" href="https://iammdtanvirrahman.github.io/atomic-weekly/favicon.svg">
<style>
:root{--bg:#07080b;--panel:#0d0f14;--line:#242832;--ink:#f4f5f7;--muted:#9298a5;--accent:#ff3b30}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}body{display:flex;flex-direction:column}.top{min-height:62px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(13,15,20,.97)}.brand{font:900 24px Georgia,serif}.brand i{font-style:normal;color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2b3039;background:#15181e;color:#fff;text-decoration:none;border-radius:7px;padding:9px 12px;font:800 12px Arial,sans-serif;cursor:pointer}.btn:hover{background:#1b1f26}.toolbar{display:none;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);background:#0b0d11}.toolbar button{border:1px solid #2b3039;background:#15181e;color:#fff;border-radius:7px;padding:7px 11px;font-weight:800;cursor:pointer}.toolbar button:disabled{opacity:.45;cursor:not-allowed}.pageInfo{font-size:12px;color:var(--muted);min-width:105px;text-align:center}.viewer{flex:1;overflow:auto;min-height:0;padding:22px 14px;background:#202329}.pageWrap{width:min(100%,950px);margin:0 auto 20px;display:flex;justify-content:center}.page{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;max-width:min(700px,calc(100vw - 30px));padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:rgba(13,15,20,.98);color:var(--muted);text-align:center;line-height:1.5}.status strong{display:block;color:var(--ink);font:900 22px Georgia,serif;margin-bottom:8px}.status.error{color:#ff8b84}.status[hidden]{display:none}@media(max-width:560px){.top{align-items:flex-start}.brand{font-size:21px}.btn{padding:8px 9px}.viewer{padding:10px 6px}.toolbar{padding:7px 5px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header class="top"><div class="brand">Atomic<i>Magazine</i></div><div class="actions"><a class="btn" id="openPdf" target="_blank" rel="noopener">Open PDF</a><a class="btn" href="./">Back to Magazine</a></div></header>
<div class="toolbar" id="toolbar"><button id="prevBtn">‹ Prev</button><span id="pageInfo" class="pageInfo">Page 0 / 0</span><button id="nextBtn">Next ›</button><button id="zoomOut">−</button><button id="zoomReset">100%</button><button id="zoomIn">+</button></div>
<main class="viewer" id="viewer"><div id="pages"></div></main>
<div id="status" class="status"><strong>Loading PDF…</strong><span id="statusText">Preparing the document viewer.</span></div>
<script>
const params=new URLSearchParams(location.search);
let src=params.get('src')||'';
function normalizePdf(value){
  let s=value||'';
  try{s=decodeURIComponent(s)}catch{}
  s=s.trim();
  if(!s)return '';
  const rawPrefix='https://raw.githubusercontent.com/iammdtanvirrahman/atomic-weekly/main/';
  const blobPrefix='https://github.com/iammdtanvirrahman/atomic-weekly/blob/main/';
  if(s.startsWith(rawPrefix))return 'https://iammdtanvirrahman.github.io/atomic-weekly/'+s.slice(rawPrefix.length);
  if(s.startsWith(blobPrefix))return 'https://iammdtanvirrahman.github.io/atomic-weekly/'+s.slice(blobPrefix.length);
  if(s.startsWith('/atomic-weekly/'))return 'https://iammdtanvirrahman.github.io'+s;
  if(s.startsWith('content/'))return 'https://iammdtanvirrahman.github.io/atomic-weekly/'+s;
  return s;
}
const pdfUrl=normalizePdf(src);
const openBtn=document.getElementById('openPdf');
const status=document.getElementById('status');
const statusText=document.getElementById('statusText');
const toolbar=document.getElementById('toolbar');
const pages=document.getElementById('pages');
const viewer=document.getElementById('viewer');
const pageInfo=document.getElementById('pageInfo');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
let doc=null,currentPage=1,scale=1;
function showError(title,text){status.className='status error';status.querySelector('strong').textContent=title;statusText.textContent=text}
function updateNav(){pageInfo.textContent=`Page ${currentPage} / ${doc?.numPages||0}`;prevBtn.disabled=currentPage<=1;nextBtn.disabled=!doc||currentPage>=doc.numPages}
async function renderPage(n){if(!doc)return;const page=await doc.getPage(n);const base=page.getViewport({scale:1});const maxWidth=Math.min(viewer.clientWidth-20,950);const fitScale=maxWidth/base.width;const vp=page.getViewport({scale:fitScale*scale});const wrap=document.createElement('div');wrap.className='pageWrap';const canvas=document.createElement('canvas');canvas.className='page';canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);wrap.appendChild(canvas);pages.innerHTML='';pages.appendChild(wrap);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;currentPage=n;updateNav()}
async function init(){
  if(!pdfUrl){showError('PDF link missing','No PDF source was provided to the viewer.');return}
  openBtn.href=pdfUrl;
  if(!window.pdfjsLib){showError('Viewer library failed','PDF.js could not be loaded. Use “Open PDF” to open the document directly.');return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  try{
    statusText.textContent='Opening the PDF from atomic-weekly/content/...';
    doc=await pdfjsLib.getDocument({url:pdfUrl}).promise;
    toolbar.style.display='flex';
    status.hidden=true;
    await renderPage(1);
  }catch(err){
    console.error(err);
    const msg=String(err?.message||err);
    if(/Invalid PDF|InvalidPDF|structure/i.test(msg))showError('This file is not a valid PDF','GitHub currently has a file at this path, but its contents are not a readable PDF. Replace the PDF in content/ with the actual PDF file, then scan again.');
    else if(/CORS|Network|Failed to fetch|fetch/i.test(msg))showError('PDF could not be loaded','The viewer could not fetch the file from GitHub Pages. Use “Open PDF” to test the source directly.');
    else showError('PDF could not be displayed',msg+' Use “Open PDF” to test the source directly.');
  }
}
prevBtn.onclick=()=>{if(currentPage>1)renderPage(currentPage-1)};
nextBtn.onclick=()=>{if(doc&&currentPage<doc.numPages)renderPage(currentPage+1)};
zoomIn.onclick=()=>{scale=Math.min(scale+0.15,2.5);renderPage(currentPage)};
zoomOut.onclick=()=>{scale=Math.max(scale-0.15,.5);renderPage(currentPage)};
zoomReset.onclick=()=>{scale=1;renderPage(currentPage)};
window.addEventListener('resize',()=>{if(doc)renderPage(currentPage)});
init();
</script>
</body>
</html>
