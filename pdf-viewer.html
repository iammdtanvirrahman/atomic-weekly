<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080b"><title>Atomic Magazine · PDF</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07080b;color:#f4f5f7;font-family:Arial,sans-serif}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #242832;background:#0d0f14}.brand{font:900 24px Georgia}.brand i{font-style:normal;color:#ff3b30}.actions{display:flex;gap:8px}.btn{border:1px solid #2b3039;background:#15181e;color:#fff;text-decoration:none;border-radius:7px;padding:9px 12px;font:800 12px Arial}.viewer{height:calc(100% - 62px);width:100%;border:0;background:#1b1b1b}
</style></head><body>
<div class="top"><div class="brand">Atomic<i>Magazine</i></div><div class="actions"><a class="btn" id="download" target="_blank" rel="noopener">Download PDF</a><a class="btn" href="index.html">Back</a></div></div>
<iframe class="viewer" id="viewer" title="PDF viewer"></iframe>
<script>
const p=new URLSearchParams(location.search),src=p.get('src');
if(src){const safe=decodeURIComponent(src);document.getElementById('viewer').src=safe;document.getElementById('download').href=safe}else{document.getElementById('viewer').src='about:blank';document.getElementById('download').remove()}
</script></body></html>
