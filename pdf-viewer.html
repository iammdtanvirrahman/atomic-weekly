<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>Atomic Magazine · PDF</title>
<link rel="icon" href="https://iammdtanvirrahman.github.io/atomic-weekly/favicon.svg">
<style>
:root{--bg:#07080b;--panel:#0d0f14;--line:#242832;--ink:#f4f5f7;--muted:#9298a5;--accent:#ff3b30}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}body{display:flex;flex-direction:column}.top{height:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(13,15,20,.97)}.brand{font:900 24px Georgia,serif}.brand i{font-style:normal;color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2b3039;background:#15181e;color:#fff;text-decoration:none;border-radius:7px;padding:9px 12px;font:800 12px Arial,sans-serif;cursor:pointer}.btn:hover{background:#1b1f26}.viewer{flex:1;width:100%;min-height:0;border:0;background:#1b1b1b}.fallback{display:none;flex:1;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted)}.fallbackBox{max-width:560px}.fallback strong{display:block;color:var(--ink);font:900 25px Georgia;margin-bottom:10px}.fallback a{display:inline-block;margin-top:16px;color:#fff;background:#15181e;border:1px solid #2b3039;border-radius:8px;padding:10px 14px;text-decoration:none;font-weight:800}@media(max-width:560px){.top{height:auto;min-height:62px;align-items:flex-start;padding:10px 9px}.brand{font-size:21px}.btn{padding:8px 9px}.viewer{min-height:calc(100vh - 76px)}}
</style>
</head>
<body>
<header class="top"><div class="brand">Atomic<i>Magazine</i></div><div class="actions"><a class="btn" id="openPdf" target="_blank" rel="noopener">Open PDF</a><a class="btn" href="./">Back to Magazine</a></div></header>
<iframe class="viewer" id="viewer" title="Atomic Magazine PDF"></iframe>
<div class="fallback" id="fallback"><div class="fallbackBox"><strong>PDF could not be embedded</strong><div>Your browser can still open the original PDF directly.</div><a id="fallbackLink" target="_blank" rel="noopener">Open PDF directly</a></div></div>
<script>
const params=new URLSearchParams(location.search);
let src=params.get('src')||'';
function normalizePdf(value){
  const s=decodeURIComponent(value||'').trim();
  if(!s)return '';
  const rawPrefix='https://raw.githubusercontent.com/iammdtanvirrahman/atomic-weekly/main/';
  if(s.startsWith(rawPrefix))return 'https://iammdtanvirrahman.github.io/atomic-weekly/'+s.slice(rawPrefix.length);
  const blobPrefix='https://github.com/iammdtanvirrahman/atomic-weekly/blob/main/';
  if(s.startsWith(blobPrefix))return 'https://iammdtanvirrahman.github.io/atomic-weekly/'+s.slice(blobPrefix.length);
  if(s.startsWith('/atomic-weekly/'))return 'https://iammdtanvirrahman.github.io'+s;
  if(s.startsWith('content/'))return 'https://iammdtanvirrahman.github.io/atomic-weekly/'+s;
  return s;
}
const pdf=normalizePdf(src),viewer=document.getElementById('viewer'),open=document.getElementById('openPdf'),fallback=document.getElementById('fallback'),fallbackLink=document.getElementById('fallbackLink');
if(pdf){viewer.src=pdf;open.href=pdf;fallbackLink.href=pdf}else{viewer.style.display='none';open.remove();fallback.style.display='flex'}
</script>
</body>
</html>
