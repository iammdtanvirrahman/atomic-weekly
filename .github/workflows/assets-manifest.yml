name: Optimize Assets and Update Manifest

on:
  push:
    paths:
      - 'assets/**'
      - 'scripts/optimize-assets.py'
      - '.github/workflows/assets-manifest.yml'
    branches: [4.0]

concurrency:
  group: asset-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  optimize-and-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate WebP derivatives
        run: python scripts/optimize-assets.py

      - name: Build asset manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          exts={'.png','.jpg','.jpeg','.webp','.gif','.svg'}
          files=[]
          for root,dirs,names in os.walk('assets'):
              dirs[:] = [d for d in dirs if d != '.git']
              for name in names:
                  if os.path.splitext(name)[1].lower() in exts:
                      files.append(os.path.relpath(os.path.join(root,name),'assets').replace('\\','/'))
          files.sort(key=str.lower)
          with open('assets/assets.json','w',encoding='utf-8') as f:
              json.dump({'assets':files},f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY

      - name: Commit optimized assets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized assets/assets.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(assets): generate optimized WebP variants [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
