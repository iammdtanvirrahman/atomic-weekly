name: Validate Atomic Weekly 4.0

on:
  push:
    branches: [4.0]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/validate-4.0.yml'
  pull_request:
    branches: [4.0]

concurrency:
  group: validate-4.0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check js/content.js
          node --check js/feed.js
          node --check js/app.js
          node --check js/scene.js
          node --check js/submission.js
          node --check scripts/smoke-test.mjs
      - name: Check static site references
        run: python scripts/check-source.py
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python -m http.server 4173 --directory . >/tmp/atomic-weekly-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atomic-weekly-http.log
          exit 1
      - name: Run browser smoke tests
        run: node scripts/smoke-test.mjs
