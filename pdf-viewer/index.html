<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atomic Magazine · PDF</title>
<style>
html,body{margin:0;height:100%;background:#07080b;color:#fff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #282d35;background:#0d0f14}.brand{font:900 24px Georgia,serif}.brand i{font-style:normal;color:#ff3b30}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{color:#fff;text-decoration:none;border:1px solid #303640;background:#171a20;border-radius:8px;padding:9px 12px;font-weight:800;font-size:12px}.viewer{flex:1;overflow:auto;padding:20px 10px;background:#202329}.page{display:block;margin:0 auto 18px;max-width:100%;height:auto;background:#fff;box-shadow:0 10px 30px #0008}.toolbar{display:none;justify-content:center;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #282d35;background:#0b0d11}.toolbar button{background:#171a20;color:#fff;border:1px solid #303640;border-radius:7px;padding:7px 11px;font-weight:800}.toolbar span{min-width:105px;text-align:center;color:#aab1bd;font-size:12px}.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px;border:1px solid #303640;border-radius:12px;background:#0d0f14;max-width:calc(100vw - 40px);text-align:center;color:#aab1bd;line-height:1.5}.status strong{display:block;color:#fff;font:900 22px Georgia,serif;margin-bottom:8px}.error{color:#ff8b84}@media(max-width:560px){.brand{font-size:20px}.viewer{padding:10px 5px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header class="top"><div class="brand">Atomic<i>Magazine</i></div><div class="actions"><a id="openPdf" class="btn" target="_blank" rel="noopener">Open PDF</a><a class="btn" href="../">Back to Magazine</a></div></header>
<div id="toolbar" class="toolbar"><button id="prev">‹ Prev</button><span id="info">Page 0 / 0</span><button id="next">Next ›</button><button id="minus">−</button><button id="reset">100%</button><button id="plus">+</button></div>
<main id="viewer" class="viewer"><div id="pages"></div></main>
<div id="status" class="status"><strong>Loading PDF…</strong><div id="statusText">Preparing viewer.</div></div>
<script>
const PUBLIC='https://iammdtanvirrahman.github.io/atomic-weekly/';const p=new URLSearchParams(location.search);let src=p.get('src')||'';try{src=decodeURIComponent(src)}catch{}src=src.trim();
if(src.startsWith('content/'))src=PUBLIC+src;
if(src.startsWith('/atomic-weekly/'))src='https://iammdtanvirrahman.github.io'+src;
const raw='https://raw.githubusercontent.com/iammdtanvirrahman/atomic-weekly/main/';if(src.startsWith(raw))src=PUBLIC+src.slice(raw.length);
const blob='https://github.com/iammdtanvirrahman/atomic-weekly/blob/main/';if(src.startsWith(blob))src=PUBLIC+src.slice(blob.length);
const status=document.getElementById('status'),statusText=document.getElementById('statusText'),pages=document.getElementById('pages'),viewer=document.getElementById('viewer'),toolbar=document.getElementById('toolbar'),info=document.getElementById('info'),prev=document.getElementById('prev'),next=document.getElementById('next');document.getElementById('openPdf').href=src||'#';let pdf=null,pageNo=1,zoom=1;
function showError(title,text){status.className='status error';status.querySelector('strong').textContent=title;statusText.textContent=text}
function nav(){info.textContent='Page '+pageNo+' / '+(pdf?.numPages||0);prev.disabled=pageNo<=1;next.disabled=!pdf||pageNo>=pdf.numPages}
async function renderPage(n){if(!pdf)return;const page=await pdf.getPage(n);const base=page.getViewport({scale:1});const fit=Math.min((viewer.clientWidth-20)/base.width,1.15);const viewport=page.getViewport({scale:fit*zoom});pages.innerHTML='';const canvas=document.createElement('canvas');canvas.className='page';canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);pages.appendChild(canvas);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;pageNo=n;nav()}
async function init(){if(!src){showError('PDF link missing','No PDF source was provided.');return}if(!window.pdfjsLib){showError('Viewer library failed','PDF.js could not be loaded.');return}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';try{statusText.textContent='Opening PDF…';pdf=await pdfjsLib.getDocument({url:src}).promise;toolbar.style.display='flex';status.hidden=true;await renderPage(1);nav()}catch(e){console.error(e);showError('PDF could not be displayed',String(e?.message||e))}}
prev.onclick=()=>pageNo>1&&renderPage(pageNo-1);next.onclick=()=>pdf&&pageNo<pdf.numPages&&renderPage(pageNo+1);document.getElementById('plus').onclick=()=>{zoom=Math.min(zoom+.15,2.5);renderPage(pageNo)};document.getElementById('minus').onclick=()=>{zoom=Math.max(zoom-.15,.5);renderPage(pageNo)};document.getElementById('reset').onclick=()=>{zoom=1;renderPage(pageNo)};addEventListener('resize',()=>pdf&&renderPage(pageNo));init();
</script>
</body>
</html>
